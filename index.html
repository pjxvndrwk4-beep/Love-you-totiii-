<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Tota 🎂</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(-45deg,#ff9ec4,#ffd6e7,#fff,#ffe1ef);background-size:400% 400%;animation:bg 12s ease infinite;color:#fff;overflow:hidden}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.page{display:none;height:100vh;align-items:center;justify-content:center;padding:20px}
.show{display:flex}
.card{max-width:720px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);padding:30px;border-radius:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
button{padding:12px 28px;border:none;border-radius:30px;font-size:18px;cursor:pointer}
#gift{font-size:110px;cursor:pointer;animation:b 2s infinite}@keyframes b{50%{transform:translateY(-10px)}}
p{line-height:2;font-size:22px}
.c{position:fixed;top:-20px;animation:f 4s linear forwards}@keyframes f{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head><body>
<div id=p1 class="page show"><div class=card><div id=gift>🎁</div><h1>To : Tota 🤍</h1><p>فيه هدية صغيرة مستنياكي...<br>اضغطي على الهدية 🎀</p></div></div>
<div id=p2 class=page><div class=card><h1>🎂 Happy Birthday 🎂</h1><h2>1 / 7 / 2004</h2><p id=msg></p><button onclick=nextMsg()>التالي</button></div></div>
<script>
const msgs=[
`انهاردة يوم مميز بلنسبالك وطبعا بلنسبالي انا كمان يمكن مكنتش ف حياتك ف يوم زي دا بس انا مبسوط اوي اني بشاركك اليوم دا احلى يوم ف الدنيا كلها عشان نيرفانا جت فييه.`,
`من ساعة ما دخلتي حياتي ونتي مغيراها ومخلياني مركز ف كل التواريخ. يوم زي دا عمري ما هنساه.`,
`انا اه يمكن مرة اتلخبطت ف التاريخ، لكن من ساعتها بقيت مركز فيه ومستحيل انساه.`,
`عايزك تعرفي ف يوم زي دا اني بحبك اوي اوي فوق ما تتخيلي، وانتي كل حاجة ليا.`,
`كل سنة ونتي طيبة يا اجمل واحن بنت ف الدنيا. كل سنة ونتي ناجحة ويارب اشوفك احسن دكتورة ف الدنيا. بتمنى افضل اشوف ضحكتك دايما منورة الدنيا. 🤍`
];
let i=0;
gift.onclick=()=>{p1.classList.remove('show');p2.classList.add('show');conf();show()};
function show(){msg.textContent=msgs[i]}
function nextMsg(){i++; if(i<msgs.length){show()}else{msg.innerHTML='🎉 Happy Birthday Tota 🎉<br><br>بحبك 🤍';}}
function conf(){for(let k=0;k<80;k++){let d=document.createElement('div');d.className='c';d.innerHTML=['🎉','✨','🤍','🎂'][Math.floor(Math.random()*4)];d.style.left=Math.random()*100+'vw';d.style.fontSize=(18+Math.random()*18)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),4000);}}
</script></body></html>
